[project]
name = "scip-ahead"
version = "0.1.0"
description = "A lightweight, local code intelligence MCP tool that ingests SCIP data into a searchable database"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "fastmcp>=2.0",
    "protobuf>=5.0",
    "sqlparse>=0.5",
]

[project.scripts]
scip-ahead = "scip_ahead.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scip_ahead"]
